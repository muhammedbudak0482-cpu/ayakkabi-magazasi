<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reels Keşfet Platformu</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; }
        .reels-container { width: 100%; max-width: 450px; height: 100vh; overflow-y: scroll; snap-type: y mandatory; }
        .reel { width: 100%; height: 100vh; snap-align: start; position: relative; background: #111; display: flex; align-items: center; justify-content: center; }
        iframe { width: 100%; height: 80%; border: none; }
        .actions { position: absolute; right: 15px; bottom: 100px; display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .action-btn { background: none; border: none; color: #fff; font-size: 28px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .action-btn span { font-size: 14px; margin-top: 5px; }
        .action-btn.liked { color: #ff3040; }
        header { position: fixed; top: 0; width: 100%; padding: 15px; text-align: center; background: rgba(0,0,0,0.5); z-index: 10; font-weight: bold; }
    </style>
</head>
<body>

<header>Reels Keşfet 🔥</header>

<div class="reels-container">
    <div class="reel">
        <iframe src="https://www.instagram.com/reels/videos/DGA_Q_6y7Nf/embed"></iframe>
        <div class="actions">
            <button class="action-btn" onclick="toggleLike(this)"><i class="fas fa-heart"></i><span>Beğen</span></button>
            <button class="action-btn" onclick="alert('Bağlantı kopyalandı!')"><i class="fas fa-share"></i><span>Paylaş</span></button>
        </div>
    </div>

    <div class="reel">
        <iframe src="https://www.instagram.com/reels/videos/DFL0LqXy4_t/embed"></iframe>
        <div class="actions">
            <button class="action-btn" onclick="toggleLike(this)"><i class="fas fa-heart"></i><span>Beğen</span></button>
            <button class="action-btn" onclick="alert('Bağlantı kopyalandı!')"><i class="fas fa-share"></i><span>Paylaş</span></button>
        </div>
    </div>
</div>

<script>
    function toggleLike(btn) {
        btn.classList.toggle('liked');
        if(btn.classList.contains('liked')) {
            btn.querySelector('span').innerText = "Beğenildi";
        } else {
            btn.querySelector('span').innerText = "Beğen";
        }
    }
</script>

</body>
</html>
