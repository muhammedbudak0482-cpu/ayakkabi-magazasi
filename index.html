<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayakkabı Dünyası | Trendy Stil</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <nav class="bg-white shadow-lg p-4 flex justify-between items-center text-orange-600 font-bold text-xl">
        <div>MAĞAZAM</div>
        <div class="space-x-4 text-sm text-gray-600">
            <span>Erkek</span> <span>Kadın</span> <span>Çocuk</span>
        </div>
    </nav>

    <div class="bg-orange-500 text-white p-10 text-center font-bold text-3xl">
        YAZ SEZONU İNDİRİMİ! %50'YE VARAN FIRSATLAR
    </div>

    <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="bg-white rounded-xl shadow-md overflow-hidden p-4">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" class="w-full h-48 object-cover rounded-lg">
            <h3 class="mt-4 font-bold text-lg text-gray-800">Air Max Pro 2026</h3>
            <p class="text-orange-600 font-bold text-xl">1.499 TL</p>
            <button class="mt-4 w-full bg-orange-500 text-white py-2 rounded-lg hover:bg-orange-600">Sepete Ekle</button>
        </div>

        <div class="bg-white rounded-xl shadow-md overflow-hidden p-4">
            <img src="https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a" class="w-full h-48 object-cover rounded-lg">
            <h3 class="mt-4 font-bold text-lg text-gray-800">Classic White Sneaker</h3>
            <p class="text-orange-600 font-bold text-xl">950 TL</p>
            <button class="mt-4 w-full bg-orange-500 text-white py-2 rounded-lg hover:bg-orange-600">Sepete Ekle</button>
        </div>
    </div>
</body>
</html>
