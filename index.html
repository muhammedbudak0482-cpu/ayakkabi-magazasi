<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Downloader | Video İndirme Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #00f2fe; --secondary: #4facfe; --bg: #0a0a0a; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .header { width: 100%; padding: 30px; text-align: center; background: #111; border-bottom: 2px solid #222; }
        .container { width: 90%; max-width: 500px; margin-top: 40px; }
        .search-box { background: #1a1a1a; padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 15px 35px rgba(0,0,0,0.7); }
        h2 { text-align: center; color: var(--primary); margin-top: 0; }
        .input-group { position: relative; margin-bottom: 20px; }
        input { width: 100%; padding: 15px; background: #222; border: 1px solid #444; border-radius: 10px; color: white; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(0, 242, 254, 0.3); }
        .btn-download { width: 100%; padding: 15px; background: linear-gradient(45deg, #4facfe 0%, #00f2fe 100%); border: none; border-radius: 10px; color: #000; font-weight: bold; font-size: 18px; cursor: pointer; transition: 0.3s; }
        .btn-download:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4); }
        .supported-platforms { display: flex; justify-content: center; gap: 20px; margin-top: 30px; font-size: 24px; color: #555; }
        .status { margin-top: 20px; display: none; text-align: center; padding: 15px; border-radius: 10px; background: #222; border: 1px solid #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 10px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="header">
    <h1 style="margin:0; font-size: 28px; letter-spacing: 2px;">M-DOWNLOADER</h1>
    <p style="color: #666; margin-top: 5px;">Hızlı, Ücretsiz ve Sınırsız</p>
</div>

<div class="container">
    <div class="search-box">
        <h2>Video Linkini Yapıştır</h2>
        <div class="input-group">
            <input type="text" id="videoLink" placeholder="https://www.instagram.com/reels/...">
        </div>
        <button class="btn-download" onclick="analyzeLink()">VİDEOYU BUL VE İNDİR</button>
        
        <div id="statusBox" class="status">
            <div class="loader"></div>
            <p id="statusText">Video analiz ediliyor...</p>
        </div>
    </div>

    <div class="supported-platforms">
        <i class="fab fa-instagram"></i>
        <i class="fab fa-tiktok"></i>
        <i class="fab fa-youtube"></i>
        <i class="fab fa-facebook"></i>
    </div>
</div>

<script>
    function analyzeLink() {
        const link = document.getElementById('videoLink').value;
        const box = document.getElementById('statusBox');
        const text = document.getElementById('statusText');

        if(link === "") {
            alert("Lütfen bir link yapıştırın!");
            return;
        }

        box.style.display = "block";
        text.innerText = "Sunucuya bağlanılıyor...";

        setTimeout(() => {
            text.innerText = "Video kaynağı ayrıştırılıyor...";
            setTimeout(() => {
                text.innerHTML = "<b style='color:#00f2fe'>VİDEO HAZIR!</b><br><br><button style='padding:10px 20px; border-radius:5px; border:none; background:#2ecc71; color:white; cursor:pointer;'>720p MP4 OLARAK İNDİR</button>";
            }, 2000);
        }, 2000);
    }
</script>

</body>
</html>
