<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Downloader | GERÇEK İNDİRİCİ</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .box { background: #111; padding: 30px; border-radius: 20px; border: 2px solid #00f2fe; max-width: 400px; margin: auto; }
        input { width: 90%; padding: 12px; margin: 20px 0; border-radius: 10px; border: none; font-size: 16px; color: #000; }
        .btn { background: linear-gradient(45deg, #4facfe, #00f2fe); color: #000; padding: 15px 30px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>
    <h1>M-DOWNLOADER V2.0</h1>
    <div class="box">
        <h3>Video Linkini Yapıştır</h3>
        <input type="text" id="vLink" placeholder="Instagram, TikTok veya YouTube...">
        <button class="btn" onclick="goDownload()">VİDEOYU ŞİMDİ İNDİR</button>
    </div>
<script>
    function goDownload() {
        const link = document.getElementById('vLink').value;
        if(link === "") { alert("Link boş olamaz!"); return; }

        // GERÇEK MOTOR YÖNLENDİRMESİ
        if(link.includes("instagram.com")) {
            window.location.href = "https://saveinsta.app/tr?url=" + encodeURIComponent(link);
        } else if(link.includes("tiktok.com")) {
            window.location.href = "https://snaptik.app/tr?url=" + encodeURIComponent(link);
        } else {
            window.location.href = "https://y2mate.is/en/?url=" + encodeURIComponent(link);
        }
    }
</script>
</body>
</html>
